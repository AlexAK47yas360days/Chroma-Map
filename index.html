<style>
  :root{
    --bg:#1c1c1c;
    --tile-hover:rgba(255,255,255,.08);
    --tile-active:rgba(255,255,255,.13);
    --text:#e8e8e8;
    --muted:#9a9a9a;
    --accent:#4cc2ff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI Variable','Segoe UI',system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(900px 500px at 15% 0%, #232323 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  .wrap{
    max-width:900px;
    margin:0 auto;
    padding:40px 32px 60px;
  }
  .titlebar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:26px;
  }
  .titlebar h1{
    font-size:15px;
    font-weight:600;
    letter-spacing:.2px;
    color:var(--text);
  }
  .titlebar .hint{
    font-size:12.5px;
    color:var(--muted);
  }
  .divider{
    height:1px;
    background:rgba(255,255,255,.08);
    margin-bottom:28px;
  }

  .grid{
    display:flex;
    flex-wrap:wrap;
    gap:4px;
  }
  .tile{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    width:92px;
    padding:12px 4px 10px;
    border-radius:6px;
    text-decoration:none;
    color:inherit;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:background .1s ease;
  }
  .tile:hover{background:var(--tile-hover);}
  .tile:active{background:var(--tile-active);}
  .tile:focus-visible{outline:1px solid var(--accent);outline-offset:-1px;background:var(--tile-hover);}

  .icon{
    width:44px;height:44px;
    border-radius:9px;
    overflow:hidden;
    margin-bottom:9px;
    background:#2c2c2c;
    box-shadow:0 0 0 1px rgba(255,255,255,.06);
  }
  .icon img{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
  }
  .label{
    font-size:12px;
    line-height:14px;
    text-align:center;
    color:var(--text);
    max-width:88px;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  @media (max-width:640px){
    .wrap{padding:28px 16px 48px;}
    .grid{gap:2px;justify-content:flex-start;}
    .tile{width:78px;padding:10px 2px 8px;}
    .icon{width:40px;height:40px;}
  }
</style>
</head>
