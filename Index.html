<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400&display=swap');
*{font-family:Geist,sans-serif}.mono{font-family:"Geist Mono",monospace}
body{background:#0e0e0f;color:#eaeaea}
input.thin{-webkit-appearance:none;height:26px;background:transparent;width:100%;cursor:pointer}
input.thin::-webkit-slider-runnable-track{height:4px;border-radius:99px;background:rgba(255,255,255,.18)}
input.thin::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid #000;margin-top:-6px}
.glass{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(18px)}
.global-track{height:38px;border-radius:12px;position:relative;background:#111;overflow:visible}
.handle{position:absolute;top:0;transform:translateX(-50%);cursor:grab;display:flex;flex-direction:column;align-items:center;user-select:none;z-index:5}
.handle .dot{width:18px;height:22px;border-radius:3px 3px 10px 10px;border:2px solid rgba(0,0,0,.6);box-shadow:0 2px 8px rgba(0,0,0,.5)}
.handle .diamond{width:8px;height:8px;transform:rotate(45deg);border:1px solid rgba(255,255,255,.7);margin-top:5px}
</style>
</head>

<script>
function randHex(){const h=Math.floor(Math.random()*360);const s=80+Math.floor(Math.random()*20);const l=50+Math.floor(Math.random()*16);return hslToHex(h,s,l);}
function hslToHex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12;const a=s*Math.min(l,1-l);const f=n=>{const c=l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return Math.round(255*c).toString(16).padStart(2,'0');};return '#'+f(0)+f(8)+f(4);}
let items=[];let gradType='linear';let angle=90;let dragId=null;
function makeItems(n){items=Array.from({length:n}).map((_,i)=>({id:Math.random().toString(36).slice(2),hex:randHex(),locked:false,pos:Math.round(i/(n-1)*100)}));}
function sorted(){return [...items].sort((a,b)=>a.pos-b.pos);}
function hexToRgb(h){return {r:parseInt(h.slice(1,3),16),g:parseInt(h.slice(3,5),16),b:parseInt(h.slice(5,7),16)};}
function gradientCSS(){const s=sorted();if(!s.length) return '#000';const stops=s.map(c=>c.hex+' '+c.pos+'%').join(', ');if(gradType==='linear') return 'linear-gradient('+angle+'deg, '+stops+')';if(gradType==='radial') return 'radial-gradient(circle at 50% 50%, '+stops+')';if(gradType==='conic') return 'conic-gradient(from '+angle+'deg at 50% 50%, '+stops+')';return s.map((c,i)=>'radial-gradient(at '+(20+(i*37)%80)+'% '+(20+(i*57)%70)+'%, '+c.hex+' 0%, transparent 65%)').join(', ');}
function renderPreview(){
const el=document.getElementById('preview');const css=gradientCSS();
if(gradType==='mesh'){el.style.backgroundImage=css;el.style.backgroundColor=items[0]?.hex||'#000';} else el.style.background=css;
document.getElementById('cssCode').textContent='background: '+css+';';
document.getElementById('globalFill').style.background='linear-gradient(90deg, '+sorted().map(c=>c.hex+' '+c.pos+'%').join(', ')+')';
document.getElementById('angleVal').textContent=angle+'°';
renderHandles();
}
function renderHandles(){const cont=document.getElementById('handles');cont.innerHTML='';sorted().forEach(it=>{const h=document.createElement('div');h.className='handle';h.style.left=it.pos+'%';h.dataset.id=it.id;h.innerHTML='<div class="dot" style="background:'+it.hex+'"></div><div class="diamond" style="background:'+it.hex+'"></div>';h.addEventListener('mousedown',startDrag);h.addEventListener('touchstart',startDrag,{passive:false});cont.appendChild(h);});}
function startDrag(e){e.preventDefault();dragId=e.currentTarget.dataset.id;document.addEventListener('mousemove',onDrag);document.addEventListener('mouseup',stopDrag);document.addEventListener('touchmove',onDrag,{passive:false});document.addEventListener('touchend',stopDrag);}
function onDrag(e){if(!dragId) return;const cx=e.touches?e.touches[0].clientX:e.clientX;const track=document.getElementById('globalTrack');const r=track.getBoundingClientRect();let pct=((cx-r.left)/r.width)*100;pct=Math.max(0,Math.min(100,Math.round(pct)));const it=items.find(x=>x.id===dragId);if(it){it.pos=pct;renderPreview();document.querySelectorAll('#list [data-role="pos"]').forEach(inp=>{if(inp.dataset.id===dragId) inp.value=pct});document.querySelectorAll('.posLabel').forEach(l=>{if(l.dataset.id===dragId) l.textContent=pct+'%';});}}
function stopDrag(){dragId=null;document.removeEventListener('mousemove',onDrag);document.removeEventListener('mouseup',stopDrag);document.removeEventListener('touchmove',onDrag);document.removeEventListener('touchend',stopDrag);renderList();}
function renderList(){const list=document.getElementById('list');list.innerHTML='';sorted().forEach(it=>{const card=document.createElement('div');card.className='rounded-[18px] glass p-3 flex flex-col gap-2';card.innerHTML='<div class="flex items-center gap-2.5"><input type="color" value="'+it.hex+'" data-id="'+it.id+'" data-role="color" class="w-10 h-10 rounded-xl bg-transparent border-0 p-0 shrink-0 cursor-pointer"><div class="flex-1 min-w-0"><div class="flex gap-1"><input data-id="'+it.id+'" data-role="hex" value="'+it.hex+'" class="mono text-[12px] w-full bg-white/10 border border-white/10 rounded-full px-3 py-1 outline-none"><button data-id="'+it.id+'" data-role="rand" class="w-8 h-8 grid place-items-center rounded-full bg-white/10 border border-white/10 text-[11px]">🎲</button></div><div class="flex items-center gap-2 mt-1.5"><span data-id="'+it.id+'" class="posLabel mono text-[10px] px-2 py-0.5 rounded-full bg-white/10">'+it.pos+'%</span><span class="mono text-[10px] text-white/30">MOVE</span></div></div><button data-id="'+it.id+'" data-role="lock" class="w-8 h-8 rounded-full border border-white/10 '+(it.locked?'bg-white text-black':'bg-white/5')+' text-xs">'+(it.locked?'🔒':'🔓')+'</button><button data-id="'+it.id+'" data-role="remove" class="w-8 h-8 rounded-full bg-white/5 border border-white/10 text-xs">✕</button></div><input type="range" min="0" max="100" value="'+it.pos+'" data-id="'+it.id+'" data-role="pos" class="thin w-full">';list.appendChild(card);});list.querySelectorAll('[data-role="pos"]').forEach(el=>el.addEventListener('input',e=>{const it=items.find(x=>x.id===e.target.dataset.id);if(!it)return;it.pos=parseInt(e.target.value);renderPreview();const lbl=e.target.closest('.glass').querySelector('.posLabel');if(lbl)lbl.textContent=it.pos+'%';}));list.querySelectorAll('[data-role="color"]').forEach(el=>el.addEventListener('input',e=>{const it=items.find(x=>x.id===e.target.dataset.id);if(it){it.hex=e.target.value;renderPreview();}}));list.querySelectorAll('[data-role="hex"]').forEach(el=>el.addEventListener('change',e=>{let v=e.target.value.trim();if(!v.startsWith('#'))v='#'+v;if(/^#[0-9a-f]{6}$/i.test(v)){const it=items.find(x=>x.id===e.target.dataset.id);if(it){it.hex=v.toLowerCase();renderPreview();renderList();}}}));list.querySelectorAll('[data-role="rand"]').forEach(el=>el.addEventListener('click',e=>{const it=items.find(x=>x.id===e.currentTarget.dataset.id);if(it&&!it.locked){it.hex=randHex();renderPreview();renderList();}}));list.querySelectorAll('[data-role="lock"]').forEach(el=>el.addEventListener('click',e=>{const it=items.find(x=>x.id===e.currentTarget.dataset.id);if(it){it.locked=!it.locked;renderList();}}));list.querySelectorAll('[data-role="remove"]').forEach(el=>el.addEventListener('click',e=>{if(items.length<=2)return;items=items.filter(x=>x.id!==e.currentTarget.dataset.id);renderPreview();renderList();}));}
function exportPNG(){const c=document.createElement('canvas');c.width=1920;c.height=1080;const ctx=c.getContext('2d');const s=sorted();const rad=angle*Math.PI/180;const len=Math.sqrt(c.width*c.width+c.height*c.height);const cx=c.width/2,cy=c.height/2;let g;if(gradType==='linear'){g=ctx.createLinearGradient(cx-Math.cos(rad)*len,cy-Math.sin(rad)*len,cx+Math.cos(rad)*len,cy+Math.sin(rad)*len);}else{g=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(c.width,c.height));}s.forEach(it=>g.addColorStop(it.pos/100,it.hex));ctx.fillStyle=g;ctx.fillRect(0,0,c.width,c.height);const a=document.createElement('a');a.download='chroma-'+Date.now()+'.png';a.href=c.toDataURL();a.click();}
function exportGGR(){const s=sorted();let out='GIMP Gradient\nName: Chroma Map\n'+(s.length-1)+'\n';for(let i=0;i<s.length-1;i++){const a=s[i],b=s[i+1];const ar=hexToRgb(a.hex),br=hexToRgb(b.hex);const l=a.pos/100,r=b.pos/100,m=(l+r)/2;out+=l.toFixed(4)+' '+m.toFixed(4)+' '+r.toFixed(4)+' '+(ar.r/255).toFixed(4)+' '+(ar.g/255).toFixed(4)+' '+(ar.b/255).toFixed(4)+' 1.0000 '+(br.r/255).toFixed(4)+' '+(br.g/255).toFixed(4)+' '+(br.b/255).toFixed(4)+' 1.0000 0 0\n';}const blob=new Blob([out],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='chroma.ggr';a.click();}
function exportGRD(){const s=sorted().map(it=>({pos:it.pos/100,color:it.hex}));const j=JSON.stringify({name:'Chroma Map',angle,type:gradType,stops:s},null,2);const b=new Blob([j],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='chroma.grd.json';a.click();}
function exportCGS(){const s=sorted();let out='CGS\n'+s.map(it=>it.pos+'% '+it.hex).join('\n');const b=new Blob([out],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='chroma.cgs.txt';a.click();}
function shufflePositions(){
  // Fisher-Yates shuffle of positions, respecting locked
  const unlocked = items.filter(it=>!it.locked);
  const posArray = unlocked.map(it=>it.pos);
  for(let i=posArray.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [posArray[i],posArray[j]]=[posArray[j],posArray[i]];}
  // also add slight random jitter so it feels fresh
  unlocked.forEach((it, idx)=>{let p=posArray[idx] + (Math.random()*10-5); it.pos=Math.max(0,Math.min(100,Math.round(p)));});
  // if all locked, shuffle all anyway
  if(unlocked.length<=1){
    const allPos = items.map(it=>it.pos);
    for(let i=allPos.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [allPos[i],allPos[j]]=[allPos[j],allPos[i]];}
    items.forEach((it,i)=>{it.pos=Math.max(0,Math.min(100,Math.round(allPos[i]+(Math.random()*12-6))));});
  }
  renderPreview();renderList();
}

document.getElementById('angle').addEventListener('input',e=>{angle=parseInt(e.target.value);renderPreview();});
document.querySelectorAll('.typeBtn').forEach(b=>b.addEventListener('click',e=>{gradType=e.currentTarget.dataset.type;document.querySelectorAll('.typeBtn').forEach(x=>x.className='typeBtn px-3 py-1 rounded-full text-xs text-white/60');e.currentTarget.className='typeBtn px-3 py-1 rounded-full text-xs bg-white text-black';renderPreview();}));
document.getElementById('shuffleBtn').addEventListener('click',()=>{items=items.map(it=>it.locked?it:{...it,hex:randHex()});renderPreview();renderList();});
document.getElementById('shufflePosBtn').addEventListener('click',shufflePositions);
document.getElementById('addBtn').addEventListener('click',()=>{if(items.length>=12)return;const last=items.length?Math.max(...items.map(i=>i.pos)):0;items.push({id:Math.random().toString(36).slice(2),hex:randHex(),locked:false,pos:Math.min(100,last+10)});renderPreview();renderList();});
document.getElementById('copyCss').addEventListener('click',async()=>{await navigator.clipboard.writeText('background: '+gradientCSS()+';');});
document.getElementById('copyHex').addEventListener('click',async()=>{await navigator.clipboard.writeText(JSON.stringify(sorted().map(i=>i.hex),null,2));});
document.getElementById('exportPng').addEventListener('click',exportPNG);
document.getElementById('exportGgr').addEventListener('click',exportGGR);
document.getElementById('exportGrd').addEventListener('click',exportGRD);
document.getElementById('exportCgs').addEventListener('click',exportCGS);
makeItems(6);renderPreview();renderList();
</script>
</body>
